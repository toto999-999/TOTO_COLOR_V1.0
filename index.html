<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AI 승부예측 시스템</title>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', '맑은 고딕', sans-serif; }
    body { background-color: #f1f5f9; padding: 14px; color: #1e293b; }
    .container { max-width: 480px; margin: 0 auto; }
    
    .header-box { text-align: center; padding: 10px 0 14px; }
    .header-title { font-size: 20px; font-weight: 800; color: #1e3a8a; margin-bottom: 4px; }
    .sub-desc { font-size: 13px; color: #64748b; }

    /* 동기화 상태 바 */
    .sync-status-box { background: #ecfdf5; border: 1.5px solid #10b981; border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; font-size: 12.5px; color: #065f46; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
    .sync-time { font-size: 11px; font-weight: 600; color: #047857; }

    /* 수동 엑셀 열기 버튼 (병행용) */
    .file-upload-box { background: #ffffff; border: 1.5px dashed #cbd5e1; border-radius: 10px; padding: 10px; text-align: center; margin-bottom: 12px; cursor: pointer; }
    .btn-file-label { font-size: 13px; font-weight: 700; color: #475569; }
    #excelFileInput { display: none; }

    /* 섹션 타이틀 */
    .section-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 4px; }
    .section-title { font-size: 15px; font-weight: 800; color: #0f172a; }

    /* 경기 목록 카드 */
    .match-list { display: flex; flex-direction: column; gap: 10px; }
    .match-card { background: #ffffff; border-radius: 12px; padding: 13px 15px; border: 1.5px solid #cbd5e1; box-shadow: 0 2px 5px rgba(0,0,0,0.04); cursor: pointer; }
    .match-card:active { background: #f8fafc; border-color: #2563eb; transform: scale(0.98); }
    
    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .badge-wrap { display: flex; gap: 4px; align-items: center; }
    .row-badge { font-size: 11px; font-weight: 800; background: #e2e8f0; color: #0f172a; padding: 2px 6px; border-radius: 4px; }
    .league-badge { font-size: 11px; font-weight: 700; background: #e0e7ff; color: #3730a3; padding: 2px 6px; border-radius: 4px; }
    .handi-badge { font-size: 11px; font-weight: 700; background: #fef3c7; color: #92400e; padding: 2px 6px; border-radius: 4px; }

    .teams { font-size: 16px; font-weight: 800; color: #0f172a; margin-bottom: 8px; }

    /* 배당 및 색칠 표시 */
    .odds-row { display: flex; gap: 4px; margin-bottom: 4px; }
    .odd-box { flex: 1; text-align: center; padding: 5px 2px; border-radius: 5px; background: #f1f5f9; border: 1px solid #e2e8f0; font-size: 11.5px; font-weight: 600; color: #475569; }
    .odd-box.colored { background-color: #9bc2e6 !important; color: #0f172a !important; font-weight: 800 !important; border-color: #2b6cb0 !important; }

    /* 팝업 모달 */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; padding: 14px; }
    .modal-box { background: #ffffff; border-radius: 14px; width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto; padding: 18px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .modal-header { font-size: 16.5px; font-weight: 800; color: #0f172a; border-bottom: 2px solid #2563eb; padding-bottom: 8px; margin-bottom: 12px; text-align: center; }
    .report-text { font-size: 13.5px; line-height: 1.6; color: #1e293b; white-space: pre-wrap; background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 14px; }
    .btn-close { width: 100%; height: 44px; background: #2563eb; color: #ffffff; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-box">
      <div class="header-title">⚡ AI 승부예측 시스템</div>
      <div class="sub-desc">클릭 한 번으로 최신 분석 결과를 확인하세요</div>
    </div>

    <!-- 자동 동기화 상태 바 -->
    <div class="sync-status-box" id="syncBox" style="display:none;">
      <span id="syncText">✔ 실시간 데이터 동기화 완료</span>
      <span class="sync-time" id="syncTime"></span>
    </div>

    <!-- 수동 엑셀 열기 (병행용 버튼) -->
    <div class="file-upload-box" onclick="document.getElementById('excelFileInput').click()">
      <span class="btn-file-label">📁 엑셀 파일 직접 선택하기 (.xlsx)</span>
      <input type="file" id="excelFileInput" accept=".xlsx, .xlsm, .xls" onchange="loadExcelFileManual(event)">
    </div>

    <!-- 섹션 타이틀 바 -->
    <div class="section-bar" id="sectionBar">
      <span class="section-title" id="sectionTitleText">🔥 오늘의 분석 대상 경기</span>
    </div>

    <!-- 경기 목록 영역 -->
    <div class="match-list" id="matchListContainer">
      <div style="text-align:center; padding:40px 10px; color:#94a3b8; font-size:14px;">
        데이터를 불러오는 중입니다...
      </div>
    </div>
  </div>

  <!-- 결과 팝업창 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <div class="modal-header">📊 [AI 승부예측 분석 리포트]</div>
      <div class="report-text" id="reportContent"></div>
      <button class="btn-close" onclick="closeModal()">확인 (닫기)</button>
    </div>
  </div>

  <script>
    let todayList = [];
    let pastDB = [];

    function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }

    // ★ 페이지 열리자마자 깃허브 최신 data.json 자동 로드
    window.onload = function() {
      fetch('data.json?t=' + Date.now())
        .then(response => {
          if (!response.ok) throw new Error("서버에 data.json이 없습니다.");
          return response.json();
        })
        .then(data => {
          todayList = data.todayList || [];
          pastDB = data.pastDB || [];

          document.getElementById('syncBox').style.display = 'flex';
          document.getElementById('syncText').innerText = `✔ 깃허브 실시간 동기화 완료 (${todayList.length}경기)`;
          document.getElementById('syncTime').innerText = data.updated || '';
          document.getElementById('sectionTitleText').innerText = `🔥 오늘의 분석 대상 경기 (${todayList.length}건)`;

          renderMatchList();
        })
        .catch(err => {
          document.getElementById('matchListContainer').innerHTML = `
            <div style="text-align:center; padding:30px; color:#64748b; font-size:13.5px;">
              PC 엑셀에서 <b>[스마트폰으로 즉시 전송]</b>을 먼저 실행하시거나,<br>
              위의 <b>[📁 엑셀 파일 직접 선택하기]</b> 버튼을 눌러주세요.
            </div>`;
        });
    };

    // 경기 목록 렌더링
    function renderMatchList() {
      const container = document.getElementById('matchListContainer');
      let html = "";

      if (!todayList.length) {
        container.innerHTML = "<div style='text-align:center;padding:30px;color:#94a3b8;'>오늘 분석할 예정 경기가 없습니다.</div>";
        return;
      }

      todayList.forEach((m, idx) => {
        let isH = false, isD = false, isA = false;
        if (m.w === "정배당") { if (m.h < m.a) isH = true; else isA = true; }
        else if (m.w === "역배당") { if (m.h > m.a) isH = true; else isA = true; }
        else if (m.w === "무배당") { isD = true; }

        if (m.x === "승") isH = true;
        if (m.x === "무") isD = true;
        if (m.x === "패") isA = true;

        let isHp = false, isHd = false, isHa = false;
        if (m.y === "정배당") { if (m.hp < m.ha) isHp = true; else isHa = true; }
        else if (m.y === "역배당") { if (m.hp > m.ha) isHp = true; else isHa = true; }
        else if (m.y === "무배당") { isHd = true; }

        if (m.z === "승") isHp = true;
        if (m.z === "무") isHd = true;
        if (m.z === "패") isHa = true;

        html += `
          <div class="match-card" onclick="analyzeMatch(${idx})">
            <div class="card-top">
              <div class="badge-wrap">
                <span class="row-badge">${m.row}행</span>
                <span class="league-badge">${m.l || '축구'}</span>
              </div>
              <span class="handi-badge">[${m.o || '0'}] 핸디캡</span>
            </div>
            <div class="teams">${m.hT} VS ${m.aT}</div>
            
            <div class="odds-row">
              <div class="odd-box ${isH ? 'colored' : ''}">홈 ${m.h}</div>
              <div class="odd-box ${isD ? 'colored' : ''}">무 ${m.d}</div>
              <div class="odd-box ${isA ? 'colored' : ''}">원정 ${m.a}</div>
            </div>

            <div class="odds-row">
              <div class="odd-box ${isHp ? 'colored' : ''}">핸승 ${m.hp}</div>
              <div class="odd-box ${isHd ? 'colored' : ''}">핸무 ${m.hd}</div>
              <div class="odd-box ${isHa ? 'colored' : ''}">핸패 ${m.ha}</div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // 경기 터치 시 4개 색칠 + O열 분석 팝업 실행
    function analyzeMatch(idx) {
      const cur = todayList[idx];

      let pickW_Res = "", pickW_Name = "", pickW_Odd = 0;
      if (cur.w === "정배당") {
        if (cur.h < cur.a) { pickW_Res = "승"; pickW_Name = "홈승"; pickW_Odd = cur.h; }
        else { pickW_Res = "패"; pickW_Name = "원정승"; pickW_Odd = cur.a; }
      } else if (cur.w === "역배당") {
        if (cur.h > cur.a) { pickW_Res = "승"; pickW_Name = "홈승"; pickW_Odd = cur.h; }
        else { pickW_Res = "패"; pickW_Name = "원정승"; pickW_Odd = cur.a; }
      } else {
        pickW_Res = "무"; pickW_Name = "무승부"; pickW_Odd = cur.d;
      }

      let pickX_Res = cur.x, pickX_Name = "", pickX_Odd = 0;
      if (cur.x === "승") { pickX_Name = "홈승"; pickX_Odd = cur.h; }
      else if (cur.x === "무") { pickX_Name = "무승부"; pickX_Odd = cur.d; }
      else if (cur.x === "패") { pickX_Name = "원정승"; pickX_Odd = cur.a; }

      let pickY_Res = "", pickY_Name = "", pickY_Odd = 0;
      if (cur.y === "정배당") {
        if (cur.hp < cur.ha) { pickY_Res = "승"; pickY_Name = "핸디승"; pickY_Odd = cur.hp; }
        else { pickY_Res = "패"; pickY_Name = "핸디패"; pickY_Odd = cur.ha; }
      } else if (cur.y === "역배당") {
        if (cur.hp > cur.ha) { pickY_Res = "승"; pickY_Name = "핸디승"; pickY_Odd = cur.hp; }
        else { pickY_Res = "패"; pickY_Name = "핸디패"; pickY_Odd = cur.ha; }
      } else {
        pickY_Res = "무"; pickY_Name = "핸디무"; pickY_Odd = cur.hd;
      }

      let pickZ_Res = cur.z, pickZ_Name = "", pickZ_Odd = 0;
      if (cur.z === "승") { pickZ_Name = "핸디승"; pickZ_Odd = cur.hp; }
      else if (cur.z === "무") { pickZ_Name = "핸디무"; pickZ_Odd = cur.hd; }
      else if (cur.z === "패") { pickZ_Name = "핸디패"; pickZ_Odd = cur.ha; }

      let matchCount = 0;
      let cntW_Hit = 0, cntX_Hit = 0, cntY_Hit = 0, cntZ_Hit = 0;
      let cntGenTotal = 0, cntHndTotal = 0;

      for (let i = 0; i < pastDB.length; i++) {
        const row = pastDB[i];
        const pastH = row[0], pastA = row[1], pastO = row[2], pastW = row[3], pastY = row[4];
        const actualX = row[5], actualZ = row[6];

        if (Math.abs(pastH - cur.h) <= 0.25 && Math.abs(pastA - cur.a) <= 0.35) {
          if ((!cur.o || pastO === cur.o) && (pastW === cur.w && pastY === cur.y)) {
            matchCount++;

            if (actualX === pickW_Res) cntW_Hit++;
            if (actualX === pickX_Res) cntX_Hit++;
            if (actualX === pickW_Res || actualX === pickX_Res) cntGenTotal++;

            if (actualZ === pickY_Res) cntY_Hit++;
            if (actualZ === pickZ_Res) cntZ_Hit++;
            if (actualZ === pickY_Res || actualZ === pickZ_Res) cntHndTotal++;
          }
        }
      }

      if (matchCount < 5) {
        alert(`동일 조건(핸디종류 [${cur.o}] & 색칠패턴)의 과거 경기 수가 부족합니다. (매칭: ${matchCount}건)`);
        return;
      }

      const rW = ((cntW_Hit / matchCount) * 100).toFixed(1);
      const rX = ((cntX_Hit / matchCount) * 100).toFixed(1);
      const rY = ((cntY_Hit / matchCount) * 100).toFixed(1);
      const rZ = ((cntZ_Hit / matchCount) * 100).toFixed(1);
      const rGen = ((cntGenTotal / matchCount) * 100).toFixed(1);
      const rHnd = ((cntHndTotal / matchCount) * 100).toFixed(1);

      const genRec = parseFloat(rW) >= parseFloat(rX) ? `[${pickW_Name} (${pickW_Odd}배당)] 추천! (${rW}%)` : `[${pickX_Name} (${pickX_Odd}배당)] 추천! (${rX}%)`;
      const hndRec = parseFloat(rY) >= parseFloat(rZ) ? `[${pickY_Name} (${pickY_Odd}배당)] 추천! (${rY}%)` : `[${pickZ_Name} (${pickZ_Odd}배당)] 추천! (${rZ}%)`;

      const report = 
`■ 경기 : ${cur.l} | ${cur.hT} vs ${cur.aT} (${cur.row}행)
■ 핸디종류(O열) : [ ${cur.o} ] 핸디캡
■ 일반배당 : [홈] ${cur.h} | [무] ${cur.d} | [원정] ${cur.a}
■ 핸디배당 : [승] ${cur.hp} | [무] ${cur.hd} | [패] ${cur.ha}
------------------------------------------
★ [현재 색칠된 4개 배당]
  1. 일반 W열 [${cur.w}] ▶ ${pickW_Name} (${pickW_Odd}배)
  2. 일반 X열 [${cur.x}] ▶ ${pickX_Name} (${pickX_Odd}배)
  3. 핸디 Y열 [${cur.y}] ▶ ${pickY_Name} (${pickY_Odd}배)
  4. 핸디 Z열 [${cur.z}] ▶ ${pickZ_Name} (${pickZ_Odd}배)
------------------------------------------
■ 과거 22,000건 중 [동일 핸디종류+동일 색칠] : ${matchCount}건 분석됨
------------------------------------------
[1. 일반경기 색칠 대결: ${pickW_Name}(${pickW_Odd}) VS ${pickX_Name}(${pickX_Odd})]
  - W [${pickW_Name}] 적중 : ${cntW_Hit}회 (${rW}%)
  - X [${pickX_Name}] 적중 : ${cntX_Hit}회 (${rX}%)
  ★ 일반 우세 픽 ▶ ${genRec}
  (일반 색칠 2개 중 1개 이상 적중 확률: ${rGen}%)
------------------------------------------
[2. 핸디경기 색칠 대결: ${pickY_Name}(${pickY_Odd}) VS ${pickZ_Name}(${pickZ_Odd})]
  - Y [${pickY_Name}] 적중 : ${cntY_Hit}회 (${rY}%)
  - Z [${pickZ_Name}] 적중 : ${cntZ_Hit}회 (${rZ}%)
  ★ 핸디 우세 픽 ▶ ${hndRec}
  (핸디 색칠 2개 중 1개 이상 적중 확률: ${rHnd}%)`;

      document.getElementById('reportContent').innerText = report;
      document.getElementById('modalOverlay').style.display = 'flex';
    }

    // 수동 파일 열기 (병행용)
    function loadExcelFileManual(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        let sName = workbook.Sheets["일반핸디"] ? "일반핸디" : workbook.SheetNames[0];
        const sheetData = XLSX.utils.sheet_to_json(workbook.Sheets[sName], { header: 1, defval: "" });
        
        todayList = []; pastDB = [];
        for (let r = 18; r < sheetData.length; r++) {
          const row = sheetData[r];
          if (!row || row.length < 10) continue;
          const h = parseFloat(row[7]) || 0, a = parseFloat(row[9]) || 0;
          const resK = String(row[10] || "").trim(), resS = String(row[18] || "").trim();
          if (h > 0 && a > 0) {
            const obj = { row: r + 1, l: String(row[2]||""), hT: String(row[3]||""), aT: String(row[5]||""), h: h, d: parseFloat(row[8])||0, a: a, o: String(row[14]||""), hp: parseFloat(row[15])||0, hd: parseFloat(row[16])||0, ha: parseFloat(row[17])||0, w: String(row[22]||""), x: String(row[23]||""), y: String(row[24]||""), z: String(row[25]||"") };
            if (resK === "" || resS === "") todayList.push(obj);
            if (resK !== "" || resS !== "") pastDB.push([h, a, obj.o, obj.w, obj.y, resK || obj.x, resS || obj.z]);
          }
        }
        document.getElementById('syncBox').style.display = 'flex';
        document.getElementById('syncText').innerText = `📁 수동 파일 로드 완료 (${todayList.length}경기)`;
        document.getElementById('syncTime').innerText = '수동 업로드';
        renderMatchList();
      };
      reader.readAsArrayBuffer(file);
    }
  </script>
</body>
</html>
